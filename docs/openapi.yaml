components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: bookflow_refresh
      description: Opaque HttpOnly refresh token; raw token never stored in DB.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must equal the JavaScript-readable bookflow_csrf cookie (Path=/), be signed and bound to the refresh session, and accompany an allowed Origin.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: *id015
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description:
        "Required by application semantics: absent -> 428; stale or unsupported tag -> 412.
        Use the exact quoted strong ETag from GET; wildcard is not accepted for optimistic concurrency."
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
          maxLength: 100
        requestId:
          type: string
          minLength: 1
          maxLength: 100
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              message:
                type: string
                minLength: 1
                maxLength: 1000
            required:
              - path
              - message
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - requestId
    Pagination:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - limit
        - total
        - totalPages
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id015
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        role: &id017
          type: string
          enum:
            - MEMBER
            - LIBRARIAN
            - ADMIN
        status: &id018
          type: string
          enum:
            - ACTIVE
            - DISABLED
        createdAt: *id016
      required:
        - id
        - fullName
        - email
        - role
        - status
        - createdAt
    RegisterInput:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - fullName
        - email
        - password
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        role: *id017
        status: *id018
      required: []
      minProperties: 1
    AuthSession:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 8192
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
        csrfToken:
          type: string
          minLength: 1
          maxLength: 256
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - tokenType
        - expiresIn
        - csrfToken
        - user
    Category:
      type: object
      additionalProperties: false
      properties:
        id: *id015
        name:
          description: Trimmed; unique case-insensitively after normalization.
          type: string
          minLength: 1
          maxLength: 100
        slug:
          description: Unique lowercase kebab-case identifier.
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        createdAt: *id016
      required:
        - id
        - name
        - slug
        - createdAt
    CategoryInput:
      type: object
      additionalProperties: false
      properties:
        name:
          description: Trimmed; unique case-insensitively after normalization.
          type: string
          minLength: 1
          maxLength: 100
        slug:
          description: Unique lowercase kebab-case identifier.
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      required:
        - name
        - slug
    BookInput:
