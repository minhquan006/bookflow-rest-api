          format: uuid
        action:
          type: string
          minLength: 1
          maxLength: 100
        entityType:
          type: string
          minLength: 1
          maxLength: 100
        entityId: *id015
        requestId:
          type: string
          minLength: 1
          maxLength: 100
        occurredAt: *id016
      required:
        - id
        - actorId
        - action
        - entityType
        - entityId
        - requestId
        - occurredAt
    Liveness:
