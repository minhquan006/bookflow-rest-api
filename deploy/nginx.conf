log_format bookflow '$request_method $uri $status requestId=$upstream_http_x_request_id';
access_log /dev/stdout bookflow;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Express enforces 100kb and returns the shared Problem Details response.
  client_max_body_size 0;

  location ~ ^/(api/|health/|docs(?:/|$)|openapi\.yaml$) {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
